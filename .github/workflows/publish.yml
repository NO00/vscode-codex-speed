name: 构建 Release 安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# 同一标签串行处理；不同版本和手动预检互不取消。
concurrency:
  group: release-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 测试、打包并保存产物
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
      RELEASE_DELETED: ${{ github.event.deleted }}
    steps:
      - name: 检出发布标签或手动预检分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: 校验版本与标签
        id: metadata
        run: bash scripts/release/check.sh
      - name: 安装锁定的依赖
        run: bash scripts/setup.sh
      - name: 运行核心及文件回放测试
        run: bash scripts/test.sh
      - name: 构建并校验 VSIX
        run: bash scripts/package.sh
      - name: 保存本次构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.metadata.outputs.vsix_path }}
            ${{ steps.metadata.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14
      - name: 创建 Release 并上传附件
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: bash scripts/release/upload.sh
        env:
          GH_TOKEN: ${{ github.token }}
