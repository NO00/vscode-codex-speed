name: 构建 Release 安装包

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# 正式 Release 与手动预检使用独立队列。
concurrency:
  group: release-package-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: 测试、打包并保存产物
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - name: 检出发布标签或手动预检分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: 校验版本与标签
        id: metadata
        run: bash scripts/release/check.sh
      - name: 安装锁定的依赖
        run: bash scripts/setup.sh
      - name: 运行核心及文件回放测试
        run: bash scripts/test.sh
      - name: 构建并校验 VSIX
        run: bash scripts/package.sh
      - name: 保存本次构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.metadata.outputs.vsix_path }}
            ${{ steps.metadata.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14
      - name: 更新 GitHub Release 附件
        if: github.event_name == 'release'
        run: bash scripts/release/upload.sh
        env:
          GH_TOKEN: ${{ github.token }}
