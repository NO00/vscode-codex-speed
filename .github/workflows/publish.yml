name: 发布到 VS Code Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      verify_oidc:
        description: 额外验证 Marketplace 可信绑定（不发布插件）
        type: boolean
        default: false

permissions:
  contents: read

# 同时只发布一个版本；手动预检与正式发布使用独立队列。
concurrency:
  group: marketplace-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: 测试、打包并保存产物
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - name: 检出发布标签或手动预检分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: 校验版本与标签
        id: metadata
        run: bash scripts/release/check.sh
      - name: 安装锁定的依赖
        run: bash scripts/setup.sh
      - name: 运行核心及文件回放测试
        run: bash scripts/test.sh
      - name: 构建并校验 VSIX
        run: bash scripts/package.sh
      - name: 保存本次构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.metadata.outputs.vsix_path }}
            ${{ steps.metadata.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14
      - name: 更新 GitHub Release 附件
        if: github.event_name == 'release'
        run: bash scripts/release/upload.sh
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: 通过 OIDC 发布到 Marketplace
    needs: build
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=NO00.vscode-codex-speed
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - name: 检出相同的发布标签
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装发布工具
        run: bash scripts/setup.sh
      - name: 下载已经测试的安装包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts
      - name: 校验并发布同一个 VSIX
        run: bash scripts/release/publish.sh

  verify-auth:
    name: 验证可信发布绑定（不发布）
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.verify_oidc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 检出预检分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装身份验证工具
        run: bash scripts/setup.sh
      - name: 仅验证短期凭证交换
        run: bash scripts/release/check-oidc.sh
